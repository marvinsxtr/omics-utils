[build-system]
requires = ["setuptools>=64.0"]
build-backend = "setuptools.build_meta"

[project]
name = "omics-utils"
version = "0.0.24"
requires-python = ">=3.12"
dependencies = [
  "hydra-zen>=0.13.0",
  "submitit>=1.5.1",
  "numpy==2.0.2",
  "pydantic>=2.10.3",
  "pandas>=2.2.3",
  "scikit-learn==1.5.2",
  "h5py>=3.12.1",
  "anndata==0.11.3",
  "dask>=2025.1.0",
  "ipykernel>=6.29.5",
  "memory-profiler>=0.61.0",
  "graphviz>=0.20.3",
  "zarr==2.18.4",
  "scanpy==1.11.0",
  "pyarrow>=19.0.0",
  "dask-jobqueue>=0.9.0",
  "ml-project-template>=0.0.12",
  "bokeh>=3.6.3",
  "sphinx>=7.3.7",
  "pydata-sphinx-theme>=0.16.1",
  "myst-parser>=4.0.1",
  "sphinx-autodoc-typehints>=3.1.0",
  "sklearn-ann>=0.1.2",
  "scipy>=1.15.1",
  "pytest>=8.3.5",
  "dask-ml>=2024.4.4",
]

[dependency-groups]
dev = [
    "ipykernel>=6.29.5",
    "ipython>=8.31.0",
    "notebook>=7.3.2",
    "pre-commit>=4.0.1",
    "ruff>=0.8.0",
]

[tool.uv.sources]
ml-project-template = { git = "https://github.com/marvinsxtr/ml-project-template.git", tag = "v0.0.12" }

[tool.pytest.ini_options]
pythonpath = ["."]

[tool.mypy]
explicit_package_bases = true
disable_error_code = ["import-untyped"]

[[tool.mypy.overrides]]
module = "cloudpathlib.*"
ignore_errors = true
follow_imports = "skip"

[tool.ruff]
exclude = ["notebooks"]
line-length = 119
indent-width = 4

[tool.ruff.lint]
select = ["ALL"]
ignore = [
    "ANN002",
    "ANN003",
    "ANN401",
    "D413",
    "COM812",
    "D100",
    "D104",
    "D107",
    "D417",
    "D205",
    "PD901",
    "D400",
    "D401",
    "D415",
    "FA",
    "SLF",
    "INP",
    "TRY003",
    "TRY201",
    "EM",
    "FBT",
    "RET",
    "C406",
    "E741",
    "PLR2004",
    "RUF009",
    "RUF012",
    "BLE001",
    "S603",
    "S607",
    "S506",
    "FIX002",
    "NPY002",
    "G004",
    "S311",
    "PIE790",
    "TRY400",
    "S108",
    "W191",
    "E111",
    "E114",
    "E117",
    "D206",
    "D300",
    "Q000",
    "Q001",
    "Q002",
    "Q003",
    "COM812",
    "COM819",
    "D203",
    "D213",
    "N806",
    "N803",
    "E712",
    "PLR0913",
    "TC001"
]

[tool.ruff.lint.per-file-ignores]
"**/tests/**/*.py" = [
    "S101",
    "ARG",
    "FBT",
]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.setuptools.packages.find]
where = ["omics_utils"]
exclude = ["notebooks"]
